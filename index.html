<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ngô Tấn Phát</title>
    <script>
      (() => {
        let lang = "en";
        try {
          if (localStorage.getItem("phat-language") === "vi") lang = "vi";
        } catch (_) {}
        const target = new URL(lang + "/index.html", location.href);
        target.hash = location.hash;
        target.search = location.search;
        location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <p>
      <a href="en/index.html">English</a> ·
      <a href="vi/index.html">Tiếng Việt</a>
    </p>
  </body>
</html>
